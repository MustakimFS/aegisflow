[project]
name = "aegisflow"
version = "0.1.0"
description = "Deterministic reliability layer for non-deterministic AI systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
    "libs/aegis_core",
    "services/gateway",
    "services/orchestrator",
    "services/reliability",
    "services/guardrails",
    "services/memory",
    "services/replay",
    "services/chaos",
]

[tool.uv.sources]
aegis_core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-redis",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PL", "TID"]
ignore = ["PLR0913", "PLR2004", "N818", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: requires docker compose stack running",
    "slow: long running",
]
