[project]
name = "memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aegis_core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory"]
