[project]
name = "guardrails"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aegis_core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jsonschema>=4.22",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrails"]
