apiVersion: v1
kind: Service
metadata: { name: replay }
spec:
  selector: { app: replay }
  ports: [{ port: 8085, targetPort: 8085, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: replay }
spec:
  replicas: 2
  selector: { matchLabels: { app: replay } }
  template:
    metadata:
      labels: { app: replay }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8085" }
    spec:
      containers:
        - name: replay
          image: ghcr.io/mustakimfs/aegisflow-replay:0.1.0
          ports: [{ containerPort: 8085 }]
          envFrom:
            - configMapRef: { name: aegisflow-config }
            - secretRef: { name: aegisflow-secrets }
          env:
            - name: POSTGRES_DSN
              value: postgresql://aegis:$(POSTGRES_PASSWORD)@postgres:5432/aegisflow
          readinessProbe: { httpGet: { path: /readyz, port: 8085 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8085 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
