apiVersion: v1
kind: Service
metadata: { name: guardrails }
spec:
  selector: { app: guardrails }
  ports: [{ port: 8083, targetPort: 8083, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: guardrails }
spec:
  replicas: 2
  selector: { matchLabels: { app: guardrails } }
  template:
    metadata:
      labels: { app: guardrails }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8083" }
    spec:
      containers:
        - name: guardrails
          image: ghcr.io/mustakimfs/aegisflow-guardrails:0.1.0
          ports: [{ containerPort: 8083 }]
          envFrom: [{ configMapRef: { name: aegisflow-config } }]
          readinessProbe: { httpGet: { path: /readyz, port: 8083 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8083 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1,    memory: 512Mi }
