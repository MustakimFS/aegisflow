apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector: { app: orchestrator }
  ports: [{ port: 8081, targetPort: 8081, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 3
  selector:
    matchLabels: { app: orchestrator }
  template:
    metadata:
      labels: { app: orchestrator }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/mustakimfs/aegisflow-orchestrator:0.1.0
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: aegisflow-config }
            - secretRef: { name: aegisflow-secrets }
          env:
            - name: POSTGRES_DSN
              value: postgresql://aegis:$(POSTGRES_PASSWORD)@postgres:5432/aegisflow
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8081 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 2,    memory: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: orchestrator }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orchestrator }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: orchestrator }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: orchestrator } }
