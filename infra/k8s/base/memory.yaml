apiVersion: v1
kind: Service
metadata: { name: memory }
spec:
  selector: { app: memory }
  ports: [{ port: 8084, targetPort: 8084, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: memory }
spec:
  replicas: 2
  selector: { matchLabels: { app: memory } }
  template:
    metadata:
      labels: { app: memory }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8084" }
    spec:
      containers:
        - name: memory
          image: ghcr.io/mustakimfs/aegisflow-memory:0.1.0
          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: aegisflow-config }
            - secretRef: { name: aegisflow-secrets }
          env:
            - name: POSTGRES_DSN
              value: postgresql://aegis:$(POSTGRES_PASSWORD)@postgres:5432/aegisflow
          readinessProbe: { httpGet: { path: /readyz, port: 8084 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8084 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
