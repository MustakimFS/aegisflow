apiVersion: v1
kind: Service
metadata: { name: chaos }
spec:
  selector: { app: chaos }
  ports: [{ port: 8086, targetPort: 8086, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: chaos }
spec:
  replicas: 1
  selector: { matchLabels: { app: chaos } }
  template:
    metadata:
      labels: { app: chaos }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8086" }
    spec:
      containers:
        - name: chaos
          image: ghcr.io/mustakimfs/aegisflow-chaos:0.1.0
          ports: [{ containerPort: 8086 }]
          envFrom: [{ configMapRef: { name: aegisflow-config } }]
          readinessProbe: { httpGet: { path: /readyz, port: 8086 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8086 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
