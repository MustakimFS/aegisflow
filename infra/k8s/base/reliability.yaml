apiVersion: v1
kind: Service
metadata: { name: reliability }
spec:
  selector: { app: reliability }
  ports: [{ port: 8082, targetPort: 8082, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: reliability }
spec:
  replicas: 3
  selector: { matchLabels: { app: reliability } }
  template:
    metadata:
      labels: { app: reliability }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: reliability
          image: ghcr.io/mustakimfs/aegisflow-reliability:0.1.0
          ports: [{ containerPort: 8082 }]
          envFrom: [{ configMapRef: { name: aegisflow-config } }]
          readinessProbe: { httpGet: { path: /readyz, port: 8082 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8082 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1,    memory: 512Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: reliability }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: reliability }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
