apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisflow-dev

resources:
  - ../../base

namePrefix: dev-

replicas:
  - name: gateway
    count: 1
  - name: orchestrator
    count: 1
  - name: reliability
    count: 1
  - name: guardrails
    count: 1
  - name: memory
    count: 1
  - name: replay
    count: 1

patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi

configMapGenerator:
  - name: aegisflow-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - CHAOS_ENABLED=true
