apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisflow

resources:
  - ../../base

replicas:
  - name: gateway
    count: 5
  - name: orchestrator
    count: 5
  - name: reliability
    count: 5
  - name: guardrails
    count: 3
  - name: memory
    count: 3
  - name: replay
    count: 3

images:
  - name: ghcr.io/mustakimfs/aegisflow-gateway
    newTag: 0.1.0
  - name: ghcr.io/mustakimfs/aegisflow-orchestrator
    newTag: 0.1.0
  - name: ghcr.io/mustakimfs/aegisflow-reliability
    newTag: 0.1.0
  - name: ghcr.io/mustakimfs/aegisflow-guardrails
    newTag: 0.1.0
  - name: ghcr.io/mustakimfs/aegisflow-memory
    newTag: 0.1.0
  - name: ghcr.io/mustakimfs/aegisflow-replay
    newTag: 0.1.0
  - name: ghcr.io/mustakimfs/aegisflow-chaos
    newTag: 0.1.0

configMapGenerator:
  - name: aegisflow-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - CHAOS_ENABLED=false
      - RATE_LIMIT_RPS=500
