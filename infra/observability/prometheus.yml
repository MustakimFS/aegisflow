global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: aegisflow

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8081"]
  - job_name: reliability
    static_configs:
      - targets: ["reliability:8082"]
  - job_name: guardrails
    static_configs:
      - targets: ["guardrails:8083"]
  - job_name: memory
    static_configs:
      - targets: ["memory:8084"]
  - job_name: replay
    static_configs:
      - targets: ["replay:8085"]
  - job_name: chaos
    static_configs:
      - targets: ["chaos:8086"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
